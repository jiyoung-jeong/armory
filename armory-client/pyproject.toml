[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/armory_client"]

[tool.hatch.build.targets.wheel.sources]
"src/armory_client" = "armory_client"

[project]
name = "armory-client"
version = "0.1.0"
description = "Lightweight client library for the armory serving system"
requires-python = ">=3.10"
dependencies = [
    "msgpack>=1.0",
    "numpy",
    "requests",
    "websockets>=13",
]