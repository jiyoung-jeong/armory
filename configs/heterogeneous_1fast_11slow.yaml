# Heterogeneous control-rate config for run_real.py.
#
# Maps workstation id (int, matches FleetConfig.robots[].id) to the control_hz
# the piper_client_armory node should declare. Robots not listed here use the
# node's default (CONTROL_HZ in client_node_armory.py).
#
# This config: 1 fast (20 Hz) + 11 slow (10 Hz) = 12 robots.
control_hz:
  14: 20
  13: 10
  12: 10
  11: 10
  8: 10
  7: 10
  6: 10
  5: 10
  4: 10
  3: 10
  2: 10
  1: 10
