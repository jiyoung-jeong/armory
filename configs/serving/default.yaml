port: 8080
max_batch_size: 4
num_steps: 10
log_dir: logs/server
scheduling_algorithm: greedy

# Lookahead scheduler params (used when scheduling_algorithm: lookahead)
lookahead_horizon_ms: 500
lookahead_timestep_ms: 50
lookahead_control_hz: 20

# ILP scheduler params (used when scheduling_algorithm: receding_horizon_ilp)
ilp_timestep_ms: 10
ilp_horizon_steps: 100
ilp_execution_fraction: 0.75
ilp_solve_timeout_ms: 1000
ilp_pack_early_weight: 0.2
ilp_obs_staleness_weight: 0.0
