[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/armory_tui"]

[tool.hatch.build.targets.wheel.sources]
"src/armory_tui" = "armory_tui"

[project]
name = "armory-tui"
version = "0.1.0"
description = "Curses TUI for orchestrating an armory real-robot fleet"
requires-python = ">=3.11"
dependencies = [
    "armory",
]

[project.scripts]
armory-tui = "armory_tui.main:run"

[tool.uv.sources]
armory = { path = "../..", editable = true }
