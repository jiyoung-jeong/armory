[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/armory_evaluation"]

[tool.hatch.build.targets.wheel.sources]
"src/armory_evaluation" = "armory_evaluation"

[project]
name = "armory-evaluation"
version = "0.1.0"
description = "Evaluation harness for the armory serving system"
requires-python = ">=3.10"
dependencies = [
    "armory-client",
    "numpy",
    "pandas",
    "pillow",
    "pydantic>=2",
    "pyarrow",
    "requests",
    "websockets>=13",
]

[tool.uv.sources]
armory-client = { workspace = true }
