[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/armory_evaluation"]

[tool.hatch.build.targets.wheel.sources]
"src/armory-evaluation" = "armory_evaluation"

[project]
name = "armory-evaluation"
version = "0.1.0"
description = "Lightweight client library for the armory serving system"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pillow",
    "requests",
    "websockets>=13",
]