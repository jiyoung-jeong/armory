[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/armory",
    "src/evaluation",
    "src/backends/openpi_adapter",
    "src/backends/gr00t_adapter",
]
dev-mode-dirs = ["src", "src/backends", "third_party/libero", "armory-client/src"]

[tool.hatch.build.targets.wheel.sources]
"src/armory" = "armory"
"src/evaluation" = "evaluation"
"src/backends/openpi_adapter" = "openpi_adapter"
"src/backends/gr00t_adapter" = "gr00t_adapter"

[tool.uv]
required-environments = ["sys_platform == 'linux'"]

[tool.uv.extra-build-dependencies]
# egl-probe uses CMake but does not declare it as a build dependency.
egl-probe = ["cmake==3.30.0"]

[project]
name = "armory"
version = "0.1.0"
description = "Serving and evaluation tools for robot policies"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "armory-client==0.1.0",
    "msgpack==1.1.1",
    "numpy==2.4.4",
    "pydantic==2.11.10",
    "pyzmq==27.1.0",
    "rich==15.0.0",
    "tyro==0.9.17",
]

[project.optional-dependencies]
evaluation = [
    "imageio==2.37.3",
    "matplotlib==3.9.2",
    "pandas==3.0.2",
    "pillow==12.2.0",
    "pyarrow==23.0.1",
    "requests==2.33.1",
    "tyro==0.9.17",
    "typing-extensions==4.15.0",
    "websockets==13.1",
]
libero = [
    "bddl==1.0.1",
    "cloudpickle==2.1.0",
    "easydict==1.9",
    "future==1.0.0",
    "gymnasium==0.29.1",
    "mujoco==3.7.0",
    "opencv-python==4.11.0.86",
    "pyopengl==3.1.10",
    "pyopengl-accelerate==3.1.10",
    "robomimic==0.2.0",
    "robosuite==1.4.1",
    "thop==0.1.1.post2209072238",
    "libero==0.1.0",
    "gym==0.26.2",
]
# Web-serving deps for armory.serving.server, split out so a mock policy server
# can run CPU-only (see cpu_mock_image) without the GPU stack below.
serving-web = [
    "dash==4.1.0",
    "fastapi==0.135.3",
    "uvicorn==0.44.0",
]
server = [
    "av==17.0.0",
    "chex==0.1.90",
    "dash==4.1.0",
    "fastapi==0.135.3",
    "gr00t==0.1.0",
    "jax[cuda12]==0.5.3; sys_platform == 'linux'",
    "jax==0.5.3; sys_platform == 'darwin'",
    "openpi==0.1.0",
    "torch==2.7.1",
    "uvicorn==0.44.0",
]
groot = [
    "albumentations==2.0.8",
    "diffusers==0.33.1",
    "dm-tree==0.1.8",
    "huggingface-hub==0.34.0",
    "opencv-python-headless==4.11.0.86",
    "pillow==12.2.0",
    "scipy==1.17.1",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.57.0",
]
dev = [
    "modal==1.5.2",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[dependency-groups]
dev = [
    "modal==1.5.2",
    "pre-commit==4.6.0",
    "pytest==9.0.3",
    "ruff==0.15.12",
]

[tool.pytest.ini_options]
addopts = "-p no:hydra_pytest"
testpaths = ["tests", "armory-client", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "armory-client/src"]
extend-exclude = ["data", "logs", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["F722", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["armory", "armory_client", "evaluation", "openpi_adapter", "gr00t_adapter"]

[tool.uv.sources]
armory-client = { path = "armory-client", editable = true }
gr00t = { path = "third_party/Isaac-GR00T", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
libero = { path = "third_party/libero", editable = true }
openpi = { path = "third_party/openpi", editable = true }
openpi-client = { path = "third_party/openpi/packages/openpi-client", editable = true }
