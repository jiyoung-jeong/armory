[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "src/armory",
    "src/evaluation",
    "src/backends/openpi_adapter",
    "src/backends/gr00t_adapter",
]
dev-mode-dirs = ["src", "src/backends", "third_party/libero", "armory-client/src"]

[tool.hatch.build.targets.wheel.sources]
"src/armory" = "armory"
"src/evaluation" = "evaluation"
"src/backends/openpi_adapter" = "openpi_adapter"
"src/backends/gr00t_adapter" = "gr00t_adapter"

[tool.uv]
required-environments = ["sys_platform == 'linux'"]

[project]
name = "armory"
version = "0.1.0"
description = "Serving and evaluation tools for robot policies"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "armory-client",
    "msgpack>=1.1",
    "numpy>=2.0",
    "pydantic>=2.11",
    "pyzmq>=27",
    "rich>=14",
    "tyro>=0.9.17",
]

[project.optional-dependencies]
evaluation = [
    "imageio>=2.36",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pillow>=10",
    "pyarrow>=15",
    "requests>=2.31",
    "tyro>=0.9",
    "typing-extensions>=4.12",
    "websockets>=13",
]
libero = [
    "bddl==1.0.1",
    "cloudpickle>=2.1",
    "easydict==1.9",
    "future>=1.0",
    "gymnasium==0.29.1",
    "mujoco>=3.1",
    "opencv-python>=4.10",
    "pyopengl==3.1.10",
    "pyopengl-accelerate==3.1.10",
    "robomimic==0.2.0",
    "robosuite==1.4.1",
    "thop>=0.1.1",
    "libero",
    "gym==0.26.2",
]
# Web-serving deps for armory.serving.server, split out so a mock policy server
# can run CPU-only (see cpu_mock_image) without the GPU stack below.
serving-web = [
    "dash>=4",
    "fastapi>=0.115",
    "uvicorn>=0.34",
]
server = [
    "av>=17",
    "chex",
    "dash>=4",
    "fastapi>=0.115",
    "gr00t",
    "jax[cuda12]==0.5.3; sys_platform == 'linux'",
    "jax==0.5.3; sys_platform == 'darwin'",
    "openpi",
    "torch==2.7.1",
    "uvicorn>=0.34",
]
groot = [
    "albumentations>=2.0,<3",
    "diffusers>=0.33,<0.34",
    "dm-tree>=0.1.8",
    "huggingface-hub>=0.34,<1",
    "opencv-python-headless>=4.10,<4.13",
    "pillow>=11",
    "scipy>=1.15",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "transformers==4.57.0",
]
dev = [
    "modal>=1.4",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.15",
]

[project.scripts]
run-libero = "evaluation.sims.libero.run:cli"

[dependency-groups]
dev = [
    "modal>=1.4",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
addopts = "-p no:hydra_pytest"
testpaths = ["tests", "armory-client", "src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "armory-client/src"]
extend-exclude = ["data", "logs", "third_party"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
ignore = ["F722", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["armory", "armory_client", "evaluation", "openpi_adapter", "gr00t_adapter"]

[tool.uv.sources]
armory-client = { path = "armory-client", editable = true }
gr00t = { path = "third_party/Isaac-GR00T", editable = true }
lerobot = { git = "https://github.com/huggingface/lerobot", rev = "0cf864870cf29f4738d3ade893e6fd13fbd7cdb5" }
libero = { path = "third_party/libero", editable = true }
openpi = { path = "third_party/openpi", editable = true }
openpi-client = { path = "third_party/openpi/packages/openpi-client", editable = true }
